<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>URL Paste</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --border: #e3e1dc;
    --text: #24211c;
    --muted: #74706a;
    --accent: #2f6f4e;
    --accent-text: #ffffff;
    --danger: #a33a2c;
    --code-bg: #f2f1ed;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a;
      --panel: #202024;
      --border: #35353b;
      --text: #e9e7e3;
      --muted: #9b9790;
      --accent: #5aab81;
      --accent-text: #10140f;
      --danger: #e08a7c;
      --code-bg: #1a1a1e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 56px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  h1 { font-size: 19px; margin: 0; letter-spacing: .01em; }
  header .sub { font-size: 12.5px; color: var(--muted); }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  textarea {
    width: 100%;
    min-height: 230px;
    resize: vertical;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--code-bg);
    color: var(--text);
    font: 13.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  textarea:focus, select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row {
    display: flex; flex-wrap: wrap; gap: 10px 18px;
    align-items: center; margin-top: 14px;
  }
  label.field { display: flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--muted); }
  select {
    padding: 7px 9px; border-radius: 7px; font: inherit; font-size: 13.5px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  .spacer { flex: 1 1 auto; }
  button {
    font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap;
    border-radius: 8px; padding: 9px 16px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button:disabled { opacity: .55; cursor: default; }
  button.small { padding: 8px 12px; font-size: 13px; }
  .counter { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ラベル + 入力 + ボタン の1行 */
  .pair { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .pair > .tag {
    flex: 0 0 auto; width: 62px; font-size: 12.5px; color: var(--muted);
  }
  .pair input {
    flex: 1 1 auto; min-width: 0;
    padding: 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--code-bg); color: var(--text);
    font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .pair input.key { letter-spacing: .06em; font-size: 14px; }

  .qr { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 16px; }
  .qr .box { background: #fff; padding: 10px; border-radius: 8px; border: 1px solid var(--border); line-height: 0; }
  .qr svg { width: 128px; height: 128px; display: block; }
  .meta { font-size: 12.5px; color: var(--muted); }

  pre.view {
    margin: 0; padding: 14px;
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
    white-space: pre-wrap; word-break: break-word;
    font: 13.5px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    max-height: 62vh; overflow-y: auto;
  }
  .notice { font-size: 13px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--code-bg); }
  .notice.warn { color: var(--danger); border-color: var(--danger); background: transparent; }
  .hidden { display: none !important; }
  footer { margin-top: 20px; font-size: 12px; color: var(--muted); text-align: center; }
  .loading { text-align: center; color: var(--muted); padding: 32px 0; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>URL Paste</h1>
    <span class="sub">貼る → 短いURLと合言葉ができる</span>
  </header>

  <!-- ============ 作成画面 ============ -->
  <section id="editor" class="panel">
    <textarea id="text" placeholder="ここにテキストを貼り付け…" spellcheck="false" autofocus></textarea>

    <div class="pair">
      <span class="tag">合言葉</span>
      <input id="pass" spellcheck="false" autocomplete="off" class="key">
      <button class="small" id="regen" type="button" title="新しい合言葉を生成">生成</button>
    </div>
    <div class="hint">この合言葉が暗号鍵になります。URLとは別に相手へ伝えてください。</div>

    <div class="row">
      <label class="field">
        有効期限
        <select id="ttl">
          <option value="3600">1時間</option>
          <option value="86400">1日</option>
          <option value="604800" selected>7日</option>
          <option value="2592000">30日</option>
        </select>
      </label>
      <label class="field">
        <input type="checkbox" id="burn"> 一回読んだら消す
      </label>
      <span class="spacer"></span>
      <span class="counter" id="counter">0 文字</span>
      <button class="primary" id="create" disabled>URLを作る</button>
    </div>
    <div class="row hidden" id="editorError"><span class="notice warn" id="editorErrorText"></span></div>
  </section>

  <!-- ============ 生成結果 ============ -->
  <section id="result" class="panel hidden">
    <div class="pair" style="margin-top:0">
      <span class="tag">URL</span>
      <input id="resultUrl" readonly>
      <button class="small" id="copyUrl">コピー</button>
    </div>
    <div class="pair">
      <span class="tag">合言葉</span>
      <input id="resultPass" readonly class="key">
      <button class="small" id="copyPass">コピー</button>
    </div>

    <div class="qr">
      <div class="box" id="qr"></div>
      <div>
        <div class="meta" id="resultMeta"></div>
        <div class="row" style="margin-top:10px">
          <button id="copyBoth">両方まとめてコピー</button>
          <button id="again">新しく作る</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 合言葉の入力 ============ -->
  <section id="unlock" class="panel hidden">
    <div class="notice">このテキストは合言葉で保護されています。</div>
    <div class="pair">
      <span class="tag">合言葉</span>
      <input id="unlockPass" spellcheck="false" autocomplete="off" class="key" placeholder="送られてきた合言葉">
      <button class="primary small" id="unlockBtn">開く</button>
    </div>
    <div class="row hidden" id="unlockError"><span class="notice warn" id="unlockErrorText"></span></div>
  </section>

  <!-- ============ 閲覧画面 ============ -->
  <section id="viewer" class="panel hidden">
    <div class="row hidden" id="burnNotice" style="margin:0 0 12px">
      <span class="notice warn">このテキストは閲覧と同時にサーバーから削除されました。このページを閉じると二度と開けません。</span>
    </div>
    <pre class="view" id="viewText"></pre>
    <div class="row">
      <span class="counter" id="viewCounter"></span>
      <span class="spacer"></span>
      <button id="copyText">本文をコピー</button>
      <button class="primary" id="newFromView">新しく作る</button>
    </div>
  </section>

  <section id="loading" class="panel hidden"><div class="loading" id="loadingText">読み込み中…</div></section>
  <section id="viewerError" class="panel hidden">
    <div class="notice warn" id="viewerErrorText"></div>
    <div class="row"><span class="spacer"></span><button class="primary" id="newFromError">新しく作る</button></div>
  </section>

  <footer>本文はブラウザ内で暗号化されます。合言葉もサーバーには送信されません。</footer>
</div>

<script src="qrcode.min.js"></script>
<script>
(function () {
  'use strict';

  // ▼▼▼ デプロイ後にここを自分のWorkerのURLに書き換える ▼▼▼
  var API_BASE = 'https://urlpaste-api.citron24ah.workers.dev';
  // ▲▲▲ 末尾のスラッシュは付けない ▲▲▲

  var MAX_CHARS = 100000;
  var PBKDF2_ITER = 600000;  // OWASP推奨値（PBKDF2-HMAC-SHA256）

  var $ = function (id) { return document.getElementById(id); };
  var show = function (el) { el.classList.remove('hidden'); };
  var hide = function (el) { el.classList.add('hidden'); };
  var paint = function () { return new Promise(function (r) { setTimeout(r, 0); }); };

  /* ---------- base64url ---------- */
  function bytesToB64u(bytes) {
    var bin = '', arr = new Uint8Array(bytes);
    for (var i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function b64uToBytes(s) {
    var t = s.replace(/-/g, '+').replace(/_/g, '/');
    while (t.length % 4) t += '=';
    var bin = atob(t), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  /* ---------- 合言葉の生成 ----------
     紛らわしい文字を除いた31文字から12文字。約59ビット。
     剰余による偏りを避けるため、範囲外の乱数は捨てて引き直す。            */
  var PASS_ALPHABET = 'abcdefghjkmnpqrstuvwxyz23456789';
  function makePassphrase() {
    var limit = 256 - (256 % PASS_ALPHABET.length);
    var out = '', got = 0;
    while (got < 12) {
      var buf = crypto.getRandomValues(new Uint8Array(16));
      for (var i = 0; i < buf.length && got < 12; i++) {
        if (buf[i] >= limit) continue;            // 偏りを生む値は捨てる
        out += PASS_ALPHABET[buf[i] % PASS_ALPHABET.length];
        got++;
        if (got % 4 === 0 && got < 12) out += '-';
      }
    }
    return out;
  }

  /* ---------- 合言葉から鍵を導出 ---------- */
  async function deriveKey(pass, salt, usage) {
    var base = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: PBKDF2_ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, usage);
  }

  async function encrypt(text, pass) {
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var key = await deriveKey(pass, salt, ['encrypt']);
    var ct = await crypto.subtle.encrypt(
      { name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(text));
    return { c: bytesToB64u(ct), iv: bytesToB64u(iv), s: bytesToB64u(salt) };
  }

  async function decrypt(cB64, ivB64, sB64, pass) {
    var key = await deriveKey(pass, b64uToBytes(sB64), ['decrypt']);
    var pt = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64uToBytes(ivB64) }, key, b64uToBytes(cB64));
    return new TextDecoder().decode(pt);
  }

  /* ---------- クリップボード ----------
     アプリ内ブラウザやiframeでは非同期APIが拒否されることがあるので、
     3段階で試し、最後は選択状態にして手動コピーへ逃がす。               */
  function flash(button, message, ms) {
    var original = button.dataset.label || button.textContent;
    button.dataset.label = original;
    button.textContent = message;
    clearTimeout(button._t);
    button._t = setTimeout(function () { button.textContent = original; }, ms || 1600);
  }

  function legacyCopy(value, inputEl) {
    var el = inputEl, temp = null;
    if (!el) {
      temp = document.createElement('textarea');
      temp.value = value;
      temp.setAttribute('readonly', '');
      temp.style.position = 'fixed';
      temp.style.top = '0';
      temp.style.opacity = '0';
      document.body.appendChild(temp);
      el = temp;
    }
    var ok = false;
    try {
      el.focus();
      el.select();
      if (el.setSelectionRange) el.setSelectionRange(0, value.length);
      ok = document.execCommand('copy');
    } catch (e) {
      ok = false;
    }
    if (temp) document.body.removeChild(temp);
    return ok;
  }

  async function copyToClipboard(value, button, inputEl) {
    var done = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(value);
        done = true;
      }
    } catch (e) { /* 次の手段へ */ }

    if (!done) {
      try { done = legacyCopy(value, inputEl); } catch (e) { done = false; }
    }

    if (done) {
      flash(button, 'コピーしました');
    } else if (inputEl) {
      inputEl.focus();
      inputEl.select();
      if (inputEl.setSelectionRange) inputEl.setSelectionRange(0, value.length);
      flash(button, '選択しました→⌘C', 3500);
    } else {
      flash(button, 'コピーできません', 2500);
    }
  }

  /* ---------- QRコード ---------- */
  function renderQR(url, container) {
    container.innerHTML = '';
    try {
      var qr = qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      container.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    } catch (e) {
      container.innerHTML = '<div class="meta" style="line-height:1.5;padding:8px">QR生成不可</div>';
    }
  }

  /* ---------- 作成 ---------- */
  var textEl = $('text'), passEl = $('pass'), counterEl = $('counter'), createBtn = $('create');

  passEl.value = makePassphrase();
  $('regen').addEventListener('click', function () { passEl.value = makePassphrase(); });

  function updateState() {
    var n = textEl.value.length;
    counterEl.textContent = n.toLocaleString() + ' 文字';
    counterEl.style.color = n > MAX_CHARS ? 'var(--danger)' : '';
    createBtn.disabled = n === 0 || n > MAX_CHARS || passEl.value.trim() === '';
  }
  textEl.addEventListener('input', updateState);
  passEl.addEventListener('input', updateState);
  updateState();

  async function create() {
    hide($('editorError'));
    createBtn.disabled = true;
    createBtn.textContent = '暗号化中…';
    await paint();                       // 鍵導出でUIが固まる前に描画させる
    try {
      var pass = passEl.value.trim();
      var enc = await encrypt(textEl.value, pass);
      var res = await fetch(API_BASE + '/api/paste', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          c: enc.c, iv: enc.iv, s: enc.s,
          ttl: Number($('ttl').value),
          burn: $('burn').checked
        })
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.message || ('サーバーエラー (' + res.status + ')'));

      var url = location.origin + location.pathname + '#' + data.id;
      $('resultUrl').value = url;
      $('resultPass').value = pass;
      renderQR(url, $('qr'));

      $('resultMeta').innerHTML =
        '有効期限: ' + new Date(data.expiresAt).toLocaleString('ja-JP') + '<br>' +
        ($('burn').checked ? '一回読まれたら削除されます' : '期限が来ると自動的に消えます');

      hide($('editor'));
      show($('result'));
      $('resultUrl').select();
    } catch (e) {
      $('editorErrorText').textContent = '作成に失敗しました: ' + e.message;
      show($('editorError'));
    } finally {
      createBtn.textContent = 'URLを作る';
      updateState();
    }
  }

  createBtn.addEventListener('click', create);
  textEl.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && !createBtn.disabled) create();
  });

  $('copyUrl').addEventListener('click', function () {
    copyToClipboard($('resultUrl').value, this, $('resultUrl'));
  });
  $('copyPass').addEventListener('click', function () {
    copyToClipboard($('resultPass').value, this, $('resultPass'));
  });
  $('copyBoth').addEventListener('click', function () {
    copyToClipboard($('resultUrl').value + '\n合言葉: ' + $('resultPass').value, this, null);
  });
  $('again').addEventListener('click', goNew);

  /* ---------- 閲覧 ---------- */
  var record = null;

  async function load(id) {
    hide($('editor'));
    show($('loading'));
    try {
      var res = await fetch(API_BASE + '/api/paste/' + encodeURIComponent(id));
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.message || ('取得できませんでした (' + res.status + ')'));
      record = data;
      hide($('loading'));
      show($('unlock'));
      $('unlockPass').focus();
    } catch (e) {
      $('viewerErrorText').textContent = e.message;
      hide($('loading'));
      show($('viewerError'));
    }
  }

  async function unlock() {
    var pass = $('unlockPass').value.trim();
    if (!pass) return;
    hide($('unlockError'));
    var btn = $('unlockBtn');
    btn.disabled = true;
    btn.textContent = '復号中…';
    await paint();
    try {
      var text = await decrypt(record.c, record.iv, record.s, pass);
      $('viewText').textContent = text;
      $('viewCounter').textContent = text.length.toLocaleString() + ' 文字';
      if (record.burn) show($('burnNotice'));
      hide($('unlock'));
      show($('viewer'));
    } catch (e) {
      $('unlockErrorText').textContent = '合言葉が違います。';
      show($('unlockError'));
      $('unlockPass').select();
    } finally {
      btn.disabled = false;
      btn.textContent = '開く';
    }
  }

  $('unlockBtn').addEventListener('click', unlock);
  $('unlockPass').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') unlock();
  });

  $('copyText').addEventListener('click', function () {
    copyToClipboard($('viewText').textContent, this, null);
  });

  var reloading = false;
  function goNew() { reloading = true; location.hash = ''; location.reload(); }
  $('newFromView').addEventListener('click', goNew);
  $('newFromError').addEventListener('click', goNew);

  window.addEventListener('hashchange', function () {
    if (reloading) return;
    reloading = true;
    location.reload();
  });

  /* ---------- 起動 ---------- */
  var hash = location.hash.replace(/^#/, '');
  if (/^[0-9A-Za-z]{4,32}$/.test(hash)) load(hash);
})();
</script>
</body>
</html>
